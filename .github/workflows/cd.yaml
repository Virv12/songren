name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Run fmt, tests & clippy
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-deb & apt tools
        uses: taiki-e/install-action@cargo-deb

      - name: Install apt repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Build .deb package
        run: cargo deb --locked

      - name: Build static APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p apt-repo
          cp target/debian/*.deb apt-repo/
          (
            cd apt-repo
            dpkg-scanpackages --multiversion . > Packages
            gzip -k -f Packages
            apt-ftparchive release . > Release
            if [ -n "$GPG_PRIVATE_KEY" ]; then
              printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
              KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
              gpg --batch --yes --armor --export "$KEY_ID" > songren.gpg
              printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -o Release.gpg Release
              printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --clearsign -o InRelease Release
            fi
          )

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repo artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apt-repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
