[package]
name = "songren"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.93"
axum = "0.7.9"
futures = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "json", "native-tls", "system-proxy"] }
serde = { version = "1.0.215", features = ["derive"] }
tokio = { version = "1.41.1", features = ["fs", "macros", "process", "rt-multi-thread"] }
tokio-stream = { version = "0.1.16", features = ["fs"] }
toml = "0.8.19"
