[package]
name = "songren"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.93"
axum = "0.7.9"
reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.215", features = ["derive"] }
tokio = { version = "1.41.1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
tempfile = "3.14.0"
