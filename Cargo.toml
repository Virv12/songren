[package]
name = "songren"
version = "0.2.1"
edition = "2021"
description = "Lightweight declarative service orchestrator for Docker, Git, Nginx, dnsmasq, and Name.com"

[package.metadata.deb]
maintainer = "virv12"
section = "admin"
priority = "optional"
depends = "docker.io | docker-ce, git, nginx, dnsmasq, systemd"
conf-files = ["/etc/songren/songren.toml"]
maintainer-scripts = "debian/"
assets = [
    ["target/release/songren", "usr/bin/", "755"],
    ["debian/songren.service", "lib/systemd/system/songren.service", "644"],
    ["debian/songren.toml", "etc/songren/songren.toml", "600"],
]

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
